# PostgreSQL and Mailpit for apistock's own module tests (ADR-0028).
#
#   docker compose up -d --wait
#   export APISTOCK_TEST_DATABASE_URL=postgres://apistock:apistock@127.0.0.1:55432/apistock?sslmode=disable
#   export APISTOCK_TEST_MAILPIT_SMTP=127.0.0.1:51025 APISTOCK_TEST_MAILPIT_URL=http://127.0.0.1:58025
#
# Host ports default to 55432, 51025 and 58025 so they don't clash with other
# projects; override with APISTOCK_POSTGRES_PORT, APISTOCK_MAILPIT_SMTP_PORT
# and APISTOCK_MAILPIT_WEB_PORT. `docker compose down -v` resets the data.
name: apistock

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: apistock
      POSTGRES_PASSWORD: apistock
      POSTGRES_DB: apistock
    ports:
      - "127.0.0.1:${APISTOCK_POSTGRES_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+ images keep versioned data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apistock -d apistock"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${APISTOCK_MAILPIT_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${APISTOCK_MAILPIT_WEB_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
