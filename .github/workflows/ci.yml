name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.module }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # PostgreSQL always comes from Docker (ADR-0028); pgtest fails instead of
    # skipping when the database is missing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: apistock
          POSTGRES_PASSWORD: apistock
          POSTGRES_DB: apistock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apistock -d apistock"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APISTOCK_TEST_DATABASE_URL: postgres://apistock:apistock@localhost:5432/apistock?sslmode=disable
      APISTOCK_REQUIRE_DB: "1"
      APISTOCK_TEST_MAILPIT_SMTP: localhost:1025
      APISTOCK_TEST_MAILPIT_URL: http://localhost:8025
      APISTOCK_REQUIRE_MAILPIT: "1"
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        module: [".", modules/auditpg, modules/jobs, modules/mail/resend, modules/mail/smtp, modules/openapi, modules/postgres, modules/settings, modules/telemetry, cli, examples/minimal, examples/full-single]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  lint:
    name: lint ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", modules/auditpg, modules/jobs, modules/mail/resend, modules/mail/smtp, modules/openapi, modules/postgres, modules/settings, modules/telemetry, cli, examples/minimal, examples/full-single]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  generated:
    name: templates, end-to-end, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: recipe templates match examples/minimal
        working-directory: cli
        run: |
          go generate ./internal/recipes/
          git diff --exit-code -- internal/recipes/minimal
      - name: api/openapi.json matches examples/minimal code
        working-directory: examples/minimal
        run: |
          go run ./cmd/api openapi > api/openapi.json
          git diff --exit-code -- api/openapi.json
      - name: api/openapi.json matches examples/full-single code
        working-directory: examples/full-single
        run: |
          go run ./cmd/api openapi > api/openapi.json
          git diff --exit-code -- api/openapi.json
      - name: generated app passes its tests; aps add mail switches providers and the app still builds
        working-directory: cli
        env:
          APS_E2E: "1"
        run: go test -run 'TestNewAppBuildsAndPassesItsTests|TestAddMailAppBuilds' -count=1 ./internal/cli/
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for m in . modules/auditpg modules/jobs modules/mail/resend modules/mail/smtp modules/openapi modules/postgres modules/settings modules/telemetry cli examples/minimal examples/full-single; do
            echo "== $m"
            (cd "$m" && govulncheck ./...)
          done

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
