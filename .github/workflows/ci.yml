name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.module }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # PostgreSQL always comes from Docker (ADR-0028); pgtest fails instead of
    # skipping when the database is missing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gorbital
          POSTGRES_PASSWORD: gorbital
          POSTGRES_DB: gorbital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorbital -d gorbital"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GORBITAL_TEST_DATABASE_URL: postgres://gorbital:gorbital@localhost:5432/gorbital?sslmode=disable
      GORBITAL_REQUIRE_DB: "1"
      GORBITAL_TEST_MAILPIT_SMTP: localhost:1025
      GORBITAL_TEST_MAILPIT_URL: http://localhost:8025
      GORBITAL_REQUIRE_MAILPIT: "1"
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        module: [".", modules/auditpg, modules/auth, modules/devconsole, modules/flags, modules/idempotency, modules/jobs, modules/jwt, modules/mail/resend, modules/mail/smtp, modules/mail/suppressionpg, modules/observability, modules/openapi, modules/orgs, modules/postgres, modules/ratelimitpg, modules/releases, modules/settings, modules/storage, modules/telemetry, gorbital, cli, examples/full-multi, examples/full-single, examples/minimal, examples/v0.1/full-multi, examples/v0.1/full-single, internal/tools/apicheck, internal/tools/refdocs]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  lint:
    name: lint ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", modules/auditpg, modules/auth, modules/devconsole, modules/flags, modules/idempotency, modules/jobs, modules/jwt, modules/mail/resend, modules/mail/smtp, modules/mail/suppressionpg, modules/observability, modules/openapi, modules/orgs, modules/postgres, modules/ratelimitpg, modules/releases, modules/settings, modules/storage, modules/telemetry, gorbital, cli, examples/full-multi, examples/full-single, examples/minimal, examples/v0.1/full-multi, examples/v0.1/full-single, internal/tools/apicheck, internal/tools/refdocs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  generated:
    name: templates, end-to-end, vulnerabilities
    runs-on: ubuntu-latest
    # A new Full app's database and email tests run against these (ADR-0041).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gorbital
          POSTGRES_PASSWORD: gorbital
          POSTGRES_DB: gorbital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorbital -d gorbital"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GORBITAL_TEST_DATABASE_URL: postgres://gorbital:gorbital@localhost:5432/gorbital?sslmode=disable
      GORBITAL_TEST_MAILPIT_SMTP: localhost:1025
      GORBITAL_TEST_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: recipe templates match the golden apps
        working-directory: cli
        run: |
          go generate ./internal/recipes/
          git diff --exit-code -- internal/recipes/minimal internal/recipes/full internal/recipes/full-multi internal/recipes/v0.2
          test -z "$(git status --porcelain -- internal/recipes/minimal internal/recipes/full internal/recipes/full-multi internal/recipes/v0.2)"
      - name: exported Go API matches the listings in api/ (ADR-0054)
        run: go run -C internal/tools/apicheck .
      - name: docs/reference matches the golden apps' error codes, audit actions, permissions, settings and jobs
        run: go run -C internal/tools/refdocs .
      - name: docs/methods matches the library's doc comments and Example functions; exported API is documented
        run: go run -C internal/tools/refdocs . -methods
      - name: api/openapi.json matches examples/minimal code
        working-directory: examples/minimal
        run: |
          go run ./cmd/api openapi > api/openapi.json
          git diff --exit-code -- api/openapi.json
      - name: api/openapi.json matches examples/full-single code
        working-directory: examples/full-single
        run: |
          go run ./cmd/api openapi > api/openapi.json
          git diff --exit-code -- api/openapi.json
      - name: api/openapi.json matches examples/full-multi code
        working-directory: examples/full-multi
        run: |
          go run ./cmd/api openapi > api/openapi.json
          git diff --exit-code -- api/openapi.json
      - name: api/openapi.json matches the v0.1-layout golden apps' code
        run: |
          for app in examples/v0.1/full-single examples/v0.1/full-multi; do
            (cd "$app" && go run ./cmd/api openapi > api/openapi.json)
          done
          git diff --exit-code -- examples/v0.1
      - name: new Minimal and Full apps (on gorbital.Main) pass their tests and accept the generators; orb add mail switches providers in new and v0.1-layout apps, which still build
        working-directory: cli
        env:
          ORB_E2E: "1"
        run: go test -run 'TestNewAppBuildsAndPassesItsTests|TestAddMailAppBuilds' -count=1 ./internal/cli/
      - name: v0.1-layout apps move to the v0.2 layout, keep their API and database, and pass their tests
        working-directory: cli
        env:
          ORB_E2E: "1"
        run: go test -run TestLayoutMoveOnV01Apps -count=1 -timeout 40m ./internal/cli/
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for m in . modules/auditpg modules/auth modules/devconsole modules/flags modules/idempotency modules/jobs modules/jwt modules/mail/resend modules/mail/smtp modules/mail/suppressionpg modules/observability modules/openapi modules/orgs modules/postgres modules/ratelimitpg modules/releases modules/settings modules/storage modules/telemetry gorbital cli examples/full-multi examples/full-single examples/minimal examples/v0.1/full-multi examples/v0.1/full-single internal/tools/apicheck internal/tools/refdocs; do
            echo "== $m"
            (cd "$m" && govulncheck ./...)
          done

  compatibility:
    name: scaffold compatibility
    runs-on: ubuntu-latest
    # Full apps generated by a released orb build and pass their tests
    # against this library: the latest v1.* release (ADR-0016's promise,
    # ADR-0054; skips until a v1 tag exists), and the published v0.1.0
    # (v0.2 is additive, roadmap decision D2).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gorbital
          POSTGRES_PASSWORD: gorbital
          POSTGRES_DB: gorbital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorbital -d gorbital"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GORBITAL_TEST_DATABASE_URL: postgres://gorbital:gorbital@localhost:5432/gorbital?sslmode=disable
      GORBITAL_TEST_MAILPIT_SMTP: localhost:1025
      GORBITAL_TEST_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, to build the released orb
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: apps generated by the latest v1 orb work with this library
        working-directory: cli
        env:
          ORB_COMPAT: "1"
        run: go test -run TestScaffoldCompatibility -count=1 -timeout 30m -v ./internal/cli/
      - name: apps generated by the published orb v0.1.0 work with this library
        working-directory: cli
        env:
          ORB_COMPAT: "1"
          ORB_COMPAT_FROM: v0.1.0
          # go install gorbital.dev/cli/cmd/orb@v0.1.0, apps created against
          # the published library, then go mod edit -replace for every library
          # module in this checkout.
          ORB_COMPAT_PUBLISHED: "1"
        run: go test -run TestScaffoldCompatibility -count=1 -timeout 30m -v ./internal/cli/

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  example-apps:
    name: example apps
    runs-on: ubuntu-latest
    # The apps in examples/apps whose code the docs' Examples tab includes
    # (examples/apps/README.md). Passes when there are none.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gorbital
          POSTGRES_PASSWORD: gorbital
          POSTGRES_DB: gorbital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorbital -d gorbital"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GORBITAL_TEST_DATABASE_URL: postgres://gorbital:gorbital@localhost:5432/gorbital?sslmode=disable
      GORBITAL_REQUIRE_DB: "1"
      GORBITAL_TEST_MAILPIT_SMTP: localhost:1025
      GORBITAL_TEST_MAILPIT_URL: http://localhost:8025
      GORBITAL_REQUIRE_MAILPIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: gofmt, vet, build and test every app in examples/apps
        run: |
          shopt -s nullglob
          mods=(examples/apps/*/go.mod)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "no example apps in examples/apps yet"
            exit 0
          fi
          status=0
          for mod in "${mods[@]}"; do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            if ! (
              cd "$dir" &&
              unformatted=$(gofmt -l .) &&
              { [ -z "$unformatted" ] || { echo "not gofmt-formatted: $unformatted"; false; }; } &&
              go vet ./... &&
              go build ./... &&
              go test -race ./...
            ); then
              echo "::error::$dir failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  contracts:
    name: frozen v0.1.0 contracts
    runs-on: ubuntu-latest
    # The golden apps' built-in endpoints and surface names stay compatible
    # with internal/contracts/v0.1.0 (its README; roadmap decision D2).
    defaults:
      run:
        working-directory: internal/tools/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: OpenAPI and api/surface.json compatible with v0.1.0
        run: go test -race -count=1 -v ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: internal/tools/contracts
