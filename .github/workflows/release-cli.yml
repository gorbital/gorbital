name: Release orb

# Push a tag like cli/v0.1.0 to build, sign and publish orb binaries as a
# draft GitHub release. Binaries are signed keylessly with Sigstore and get
# SLSA build provenance attestations (ADR-0029, threat 7).
on:
  push:
    tags: ["cli/v*"]

permissions: {}

env:
  # The gorbital-dashboards ref whose apps/devtools build is embedded as the
  # Dev Portal UI (ADR-0066).
  PORTAL_REF: main

jobs:
  release:
    runs-on: ubuntu-latest
    # The release environment requires a maintainer's approval before the job
    # gets its signing identity. Repository settings, not this file, enforce
    # it: environment "release" with required reviewers and only cli/v* tags
    # allowed to deploy, and a tag ruleset that lets only maintainers create
    # cli/v* tags (ADR-0029, threat 7).
    environment: release
    permissions:
      contents: write     # create the draft release
      id-token: write     # keyless Sigstore signing
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which isn't on main: releases are cut from main"
            exit 1
          fi
      # No cache: a module or build cache saved by another workflow run could
      # otherwise end up in signed binaries. check-latest builds with the
      # newest patch release, whatever the runner has installed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: test
        working-directory: cli
        run: go test ./...
      # The Dev Portal UI (ADR-0066): built from gorbital-dashboards at the
      # pinned ref below and embedded in orb by scripts/sync-portal.sh.
      # Change PORTAL_REF to ship a newer UI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gorbital/gorbital-dashboards
          ref: ${{ env.PORTAL_REF }}
          path: gorbital-dashboards
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: build and embed the Dev Portal UI
        run: scripts/sync-portal.sh "$GITHUB_WORKSPACE/gorbital-dashboards"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: version from tag
        run: echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME#cli/}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
            cli/dist/checksums.txt
