name: Release aps

# Push a tag like cli/v0.1.0 to build, sign and publish aps binaries as a
# draft GitHub release. Binaries are signed keylessly with Sigstore and get
# SLSA build provenance attestations (ADR-0029, threat 7).
on:
  push:
    tags: ["cli/v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the draft release
      id-token: write     # keyless Sigstore signing
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: cli/go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: version from tag
        run: echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME#cli/}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
            cli/dist/checksums.txt
