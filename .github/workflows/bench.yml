name: Benchmarks

# Runs every Go benchmark on the pull request's base and head with
# scripts/bench.sh (-bench . -benchmem -count 6 -run '^$') and writes the
# benchstat comparison to the job summary.
#
# Non-blocking for now: the job reports and never fails the pull request.
# The budgets in docs/benchmarks.md are enforced from v0.2 Phase 1 on the
# phases that touch them.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchstat:
    name: benchstat base and head
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    # Some benchmarks run on PostgreSQL (pgtest).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gorbital
          POSTGRES_PASSWORD: gorbital
          POSTGRES_DB: gorbital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gorbital -d gorbital"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      GORBITAL_TEST_DATABASE_URL: postgres://gorbital:gorbital@localhost:5432/gorbital?sslmode=disable
      GORBITAL_REQUIRE_DB: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: benchmarks on the head
        run: scripts/bench.sh > "$RUNNER_TEMP/head.txt"
      - name: benchmarks on the base
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          # This pull request's script, run in the base checkout.
          (cd "$RUNNER_TEMP/base" && "$GITHUB_WORKSPACE/scripts/bench.sh") > "$RUNNER_TEMP/base.txt"
      - name: benchstat
        run: |
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da \
            base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt" > "$RUNNER_TEMP/benchstat.txt"
          cat "$RUNNER_TEMP/benchstat.txt"
          {
            echo "## Benchmarks: base ${BASE_SHA:0:7} and this pull request"
            echo
            echo "Not enforced yet; budgets: docs/benchmarks.md."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/benchstat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
