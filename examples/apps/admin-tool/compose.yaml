# Local services for development and tests.
#
#   orb dev                       # or, without the gorbital CLI:
#   docker compose up -d --wait
#   go run ./cmd/api migrate && go run ./cmd/api
#
# PostgreSQL on 127.0.0.1:5432. `docker compose down -v` resets the data.
name: admin-tool

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: admin_tool
      POSTGRES_PASSWORD: admin_tool
      POSTGRES_DB: admin_tool
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_tool -d admin_tool"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
