# Local services for development and tests.
#
#   orb dev                       # or, without the gorbital CLI:
#   docker compose up -d --wait
#   go run ./cmd/api migrate && go run ./cmd/api
#
# PostgreSQL on 127.0.0.1:5432. `docker compose down -v` resets the data.
name: shelfie

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: shelfie
      POSTGRES_PASSWORD: shelfie
      POSTGRES_DB: shelfie
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfie -d shelfie"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
